{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Task</title>
    <link rel="stylesheet" href="{% static 'home.css' %}">
    <link rel="stylesheet" href="{% static 'edit_task.css' %}">
</head>
<body>
    <nav>
        <span class="logo">Todo APP</span>
        <a class="btn add" href="{% url 'home' %}">All Tasks</a>
    </nav>

    <main>
        <h1>Edit Task</h1>
        <form method="post">
            {% csrf_token %}
            <label for="title">Title</label>
            <input type="text" id="title" name="title" value="{{ task.title }}" required autofocus>

            <label for="description">Description</label>
            <textarea id="description" name="description" rows="4">{{ task.description }}</textarea>

            <label class="check">
                <input type="checkbox" name="done" {% if task.done %}checked{% endif %}> Done
            </label>

            <button class="btn add save" type="submit">Save</button>
        </form>
    </main>
</body>
</html>
